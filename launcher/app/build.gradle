plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carhome'
        // The head unit runs Android 7.1.1 (SDK 25).
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // The head unit is 32-bit ARM; 64-bit ARM is for the emulator on an Apple-silicon Mac.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // android.jar methods return defaults instead of throwing, for plain JVM tests.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // TLS 1.3 for Android 7.1, whose own TLS stops at 1.2: the routing servers accept only 1.3.
    implementation 'org.conscrypt:conscrypt-android:2.8.0'
    // The platform's HTTP client pins TLS 1.0-1.2 itself; OkHttp 3.12 (last line for old Android) offers 1.3.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub in JVM tests; the real one parses the saved routes.
    testImplementation 'org.json:json:20240303'
}
